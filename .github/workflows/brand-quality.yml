name: Brand Quality
on:
  push:
  pull_request:
permissions:
  contents: read
concurrency:
  group: brand-quality-${{ github.ref }}
  cancel-in-progress: true
jobs:
  docs:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - run: test -f README.md && test -f SECURITY.md && test -f BRAND.md
